<title>Max Mockett</title>
<meta name="description" content="Projects by Max Mockett: Skim, Spirit Aquarium and PLASM for iPhone, and instruments for the teenage engineering OP–XY.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@700&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
:root { --ink: #1b1a17; --muted: #6d695f; --paper: #e9e4d8; --line: rgba(0,0,0,.1); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; }
img, video { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
canvas#table { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* Header: name and every section */
/* A bar in the page's own colour, blurring what passes under it, so the name and links stay readable over a model */
.hdr { position: fixed; z-index: 6; top: 0; left: 0; right: 0; padding: 14px 16px 16px; display: grid; gap: 2px; pointer-events: none;
  background: color-mix(in srgb, var(--paper) 78%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1);
  -webkit-mask-image: linear-gradient(#000 calc(100% - 10px), transparent); mask-image: linear-gradient(#000 calc(100% - 10px), transparent); }
.hdr > * { max-width: calc(100vw - 32px); }
.hdr > * { pointer-events: auto; }
.hdr .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hdr h1 { margin: 0; white-space: nowrap; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.hdr h1 a { text-decoration: none; }
.hdr p { margin: 0; font-size: 13px; color: var(--muted); }
.hdr nav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: -6px; }
.hdr nav a { font-size: 13px; white-space: nowrap; text-decoration: none; color: var(--muted); padding: 3px 6px; border-radius: 6px; }
.hdr nav a:hover, .hdr nav a.on { color: var(--ink); background: rgba(0,0,0,.05); }
.hdr nav .out { width: 9px; height: 9px; margin-left: 3px; vertical-align: 1px; opacity: .75; }
/* Previous and next project, while one is open */
.car { display: none; }
body.open.proj .car { display: block; }
.car button { position: fixed; z-index: 6; top: 50%; width: 42px; height: 42px; margin-top: -21px; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
  color: var(--ink); background: color-mix(in srgb, var(--paper) 70%, #fff); box-shadow: 0 0 0 1px var(--line), 0 4px 14px rgba(0,0,0,.08); }
.car button:hover { background: color-mix(in srgb, var(--paper) 40%, #fff); }
.car svg { width: 20px; height: 20px; }
.car .prev { left: 16px; }
.car .next { right: calc(min(520px, 42vw) + 16px); }
@media (max-width: 760px) { .car button { top: calc(21svh + 40px); } .car .next { right: 12px; } .car .prev { left: 12px; } }
body.dark-hdr .hdr, body.dark-hdr .hint { color: #f0f0ee; }
body.dark-hdr .hdr p, body.dark-hdr .hdr nav a { color: rgba(240,240,238,.7); }
@media (max-width: 760px) {
  .hdr { padding: 10px 12px 14px; }
  .hdr > * { max-width: none; }
  .hdr .row { flex-wrap: nowrap; gap: 10px; }
  .hdr nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -12px; padding-right: 12px; }
  .hdr nav::-webkit-scrollbar { display: none; }
  .hdr p { font-size: 12.5px; max-width: 30ch; }
  body.open .hdr p { display: none; }
  body.open .hint { display: none; }
}
.hint { position: fixed; z-index: 5; left: 16px; bottom: 14px; font: 400 12px "IBM Plex Mono", monospace; color: var(--muted); transition: opacity .3s; }

/* Labels under the models */
#labels .label { position: fixed; left: 0; top: 0; z-index: 3; border: 0; background: none; text-align: center; cursor: pointer; padding: 4px 8px; transition: opacity .35s; white-space: nowrap; }
#labels .label b { display: flex; align-items: flex-end; justify-content: center; height: 31px; font-size: 14px; font-weight: 600; }   /* logos share a baseline */
/* Each project's name as its own logo */
.logo { display: inline-block; line-height: 1; }
.logo svg { display: block; height: 100%; width: auto; overflow: visible; }
.logo-skim { font: 700 25px/1 Kalam, cursive; color: #10243a; letter-spacing: -.01em; rotate: -2deg; margin-bottom: -5.4px; }   /* text logos drop by their font's descent, so every logo's letters sit 1.5 px above the label's floor, as the drawn ones do */
.logo-aq { font: italic 600 21px/1 Fraunces, Georgia, serif; color: #1d4b48; letter-spacing: -.01em; margin-bottom: -1.5px; }
.logo-plasm { height: 21px; }
.logo-xy { height: 17px; color: #111; }
#labels .label.hot .logo { filter: brightness(1.12); }
body.open #labels .label { opacity: 0; pointer-events: none; }

/* Panel: the project's own words and its real screenshots and videos */
.panel { position: fixed; z-index: 7; top: 0; right: 0; bottom: 0; width: min(520px, 42vw); overflow-y: auto; overscroll-behavior: contain; padding: 60px 32px 40px;
  background: var(--pbg, #f6f3ec); color: var(--pink, var(--ink)); transform: translateX(calc(100% + 100px)); transition: transform .6s cubic-bezier(.2,.8,.2,1); box-shadow: -24px 0 60px rgba(0,0,0,.12); }
body.open .panel { transform: none; }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.panel .x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; border: 1px solid currentColor; background: none; cursor: pointer; opacity: .65; font-size: 18px; line-height: 1; }
.panel .x:hover { opacity: 1; }
@media (max-width: 760px) {
  .panel { top: auto; width: 100%; height: 58vh; height: 58svh; transform: translateY(104%); padding: 24px 18px 36px; border-radius: 18px 18px 0 0; box-shadow: 0 -20px 50px rgba(0,0,0,.15); }
  .panel .x { top: 12px; right: 12px; }
}
.panel[data-p="skim"] { --pbg: #f5f2ea; --pink: #10243a; }
.panel[data-p="spirit-aquarium"] { --pbg: #17241f; --pink: #e6ede4; }
.panel[data-p="plasm"] { --pbg: #d8d1bf; --pink: #2a261f; }
.panel[data-p="op-xy"], .panel[data-p="music"] { --pbg: #050505; --pink: #f2f2f2; }

.title { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.title img, .title .glyph { width: 56px; height: 56px; border-radius: 13px; flex: none; box-shadow: 0 0 0 1px rgba(127,127,127,.25); }
.title .glyph { display: grid; place-items: center; background: #000; color: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
h2 { margin: 0; font-size: 28px; line-height: 1.12; font-weight: 600; letter-spacing: -.02em; }
.kind { font-size: 13px; opacity: .7; margin-top: 3px; }
.lede { font-size: 19px; line-height: 1.4; margin: 0 0 10px; }
.panel p { margin: 0 0 12px; }
.offers { list-style: none; padding: 0; margin: 14px 0 0; font-size: 14.5px; }
.offers li { padding: 8px 0 8px 18px; position: relative; border-top: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
.offers li::before { content: ""; position: absolute; left: 0; top: 18px; width: 8px; height: 1.5px; background: currentColor; opacity: .55; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 15px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: none; cursor: pointer; }
.btn.primary { background: var(--pink, var(--ink)); color: var(--pbg, #fff); border-color: transparent; }
.btn svg { width: 16px; height: 16px; }

.strip { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; margin: 26px -32px 0; padding: 4px 32px 10px; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; }
.strip::-webkit-scrollbar { display: none; }
@media (max-width: 760px) { .strip { margin: 20px -18px 0; padding: 4px 18px 10px; } }
.strip figure { margin: 0; flex: none; scroll-snap-align: start; scroll-margin-left: 32px; }
.strip figure button { all: unset; display: block; cursor: zoom-in; }
.strip figure button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 20px; }
.phone { width: 200px; aspect-ratio: 1290 / 2796; border-radius: 23px; overflow: hidden; background: #000; position: relative; box-shadow: 0 0 0 1px rgba(127,127,127,.25), 0 10px 26px rgba(0,0,0,.18); }
.wide { height: 190px; aspect-ratio: var(--r, 2.17); overflow: hidden; background: #000; position: relative; }
.phone img, .phone video, .wide img, .wide video { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 760px) { .phone { width: 150px; border-radius: 18px; } .wide { height: 130px; } }
.panel[data-p="op-xy"] .wide { outline: 1px solid rgba(255,255,255,.85); outline-offset: 4px; margin: 5px; }
.panel[data-p="plasm"] .phone { box-shadow: 0 0 0 8px #cbc3ae, 0 0 0 9px rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.25); margin: 9px; }
.panel[data-p="spirit-aquarium"] .phone { box-shadow: 0 0 0 1px rgba(220,240,225,.2), 0 0 36px rgba(170,220,190,.18); }
figcaption { margin-top: 8px; font-size: 12.5px; opacity: .7; max-width: 200px; }
.wide + figcaption { max-width: none; }
.tag { position: absolute; left: 9px; top: 9px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; pointer-events: none; }

.player { margin-top: 20px; border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 12px; overflow: hidden; min-height: 150px; display: grid; place-items: center; }
.player iframe { display: block; width: 100%; height: 400px; border: 0; }
.player .load { text-align: center; padding: 28px 16px; font-size: 14px; opacity: .8; }
.credits li { font-size: 13.5px; }

/* Viewer for a single screenshot or video */
dialog.viewer { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: rgba(8,8,8,.96); color: #fff; }
dialog.viewer::backdrop { background: transparent; }
.viewer .stage { position: absolute; inset: 56px 72px 72px; display: grid; place-items: center; }
.viewer .stage img, .viewer .stage video { max-width: calc(100vw - 144px); max-height: calc(100vh - 128px); width: auto; height: auto; border-radius: 16px; object-fit: contain; }
@media (max-width: 760px) { .viewer .stage { inset: 56px 8px 80px; } .viewer .stage img, .viewer .stage video { max-width: calc(100vw - 16px); max-height: calc(100vh - 136px); } }
.viewer .x, .viewer .nav { position: absolute; border: 0; background: rgba(255,255,255,.1); color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.viewer .x { top: 12px; right: 12px; }
.viewer .prev { left: 16px; top: 50%; transform: translateY(-50%); }
.viewer .next { right: 16px; top: 50%; transform: translateY(-50%); }
@media (max-width: 760px) { .viewer .prev, .viewer .next { top: auto; bottom: 18px; transform: none; } .viewer .prev { left: calc(50% - 56px); } .viewer .next { right: calc(50% - 56px); } }
.viewer svg { width: 18px; height: 18px; }
.viewer .cap { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 14px; color: rgba(255,255,255,.75); padding: 0 72px; }

/* Looks being tried (?look=name), and the switcher between them */
body[data-look="memory"] { --ink: #33294f; --muted: #6f6590; --paper: #ddd4f3; }
body[data-look="memory"][data-room="pink"] { --ink: #3d2b45; --muted: #7d6680; --paper: #f2cdd1; }
body[data-look="memory"][data-room="butter"] { --ink: #463a2c; --muted: #81715a; --paper: #f6eaa8; }
body[data-look="memory"] .panel { --pink: var(--ink); box-shadow: -24px 0 60px rgba(90,40,80,.12); }
body[data-look="memory"] .panel[data-p="skim"] { --pbg: #eaf5f6; }
body[data-look="memory"] .panel[data-p="spirit-aquarium"] { --pbg: #e6f4ee; }
body[data-look="memory"] .panel[data-p="plasm"] { --pbg: #f8eedb; }
body[data-look="memory"] .panel[data-p="op-xy"], body[data-look="memory"] .panel[data-p="music"] { --pbg: #eee8fb; }
body[data-look="pearl"] { --ink: #16202e; --muted: #5b6578; --paper: #d6dce8; }
body[data-look="cel"] { --ink: #2b2420; --muted: #6e6253; --paper: #efe7d4; }
body[data-look="system"] { --ink: #e8eefc; --muted: rgba(232,238,252,.62); --paper: #060a17; }
body[data-look="system"] .hdr nav a:hover, body[data-look="system"] .hdr nav a.on { color: #fff; background: rgba(255,255,255,.08); }
.looks { position: fixed; z-index: 8; right: 14px; bottom: 12px; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 80%, #000 6%); box-shadow: 0 0 0 1px var(--line); font: 400 12px "IBM Plex Mono", monospace; }
body[data-look="system"] .looks { box-shadow: 0 0 0 1px rgba(255,255,255,.14); }
.looks a { padding: 4px 10px; border-radius: 999px; text-decoration: none; color: var(--muted); white-space: nowrap; }
.looks a.on { background: var(--ink); color: var(--paper); }
body.open .looks { right: calc(min(520px, 42vw) + 14px); }
@media (max-width: 760px) { .looks { left: 12px; right: 12px; bottom: 44px; overflow-x: auto; scrollbar-width: none; } body.open .looks { display: none; } }

/* Without WebGL: the same sections as a plain page */
#flat { display: none; }
body.flat { overflow: auto; }
body.flat #flat { display: block; max-width: 980px; margin: 0 auto; padding: 110px 20px 60px; }
body.flat #table, body.flat #labels, body.flat .hint, body.flat .panel { display: none; }
body.flat #flat section { padding: 40px 0; border-top: 1px solid var(--line); }
body.flat .strip { margin: 20px 0 0; padding: 4px 0 10px; }
</style>

      links: [

        { label: "open-xy.com", href: "https://open-xy.com" },
        { label: "GitHub", href: "https://github.com/mmockett/OP-XY-MNMD", icon: "github" }
      ],

      media: [

      icon: "media/aquarium-icon.jpg",
      hint: "Some of the fish follow you. Click to drop in food",

        "The aquarium's floor and fish come from SoundPond and Spirit Aquarium. The OP–XY model is my own, measured from teenage engineering's published layout. OP–XY is a trademark of teenage engineering.",
        "Built with three.js."

    }

};

const ICONS = {
  apple: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.9-.9-3-.8c-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.5 1.3-2.6 0 0-2.5-1-2.5-3.8zM14.1 5.8c.6-.8 1.1-1.8 1-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-1 2.7 1 .1 2-.5 2.6-1.3z"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 00-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.7 0 0 .8-.3 2.8 1a9.6 9.6 0 015 0c1.9-1.3 2.8-1 2.8-1 .5 1.4.2 2.4.1 2.7.6.7 1 1.6 1 2.7 0 3.9-2.4 4.7-4.6 5 .4.3.7.9.7 1.9V21c0 .3.2.6.7.5A10 10 0 0012 2z"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches || /[?&]still\b/.test(location.search);
const phone = matchMedia("(max-width: 760px)").matches || matchMedia("(pointer: coarse)").matches;
// ?look=name picks a look being tried; a copy that can't take a query string remembers the pick for the tab instead.
const lookQuery = new URLSearchParams(location.search).get("look");
// The page uses the Current look; ?look=name still shows another, and ?looks adds the switcher, for comparing.
const lookParam = lookQuery ?? "none";
const roomParam = new URLSearchParams(location.search).get("room") ?? "lilac";
const trying = /[?&]looks\b/.test(location.search);
const paras = s => (s.text || []).map(t => `<p>${esc(t)}</p>`).join("");
const linkButtons = (links = []) => links.length ? `<div class="links">${links.map(l =>
  `<a class="btn${l.primary ? " primary" : ""}" href="${esc(l.href)}" target="_blank" rel="noopener">${l.icon ? ICONS[l.icon] : ""}${esc(l.label)}</a>`).join("")}</div>` : "";

const RENDER = {
  project(s) {
    const badge = s.icon ? `<img src="${esc(s.icon)}" alt="" width="56" height="56">` : `<div class="glyph">${esc(s.glyph || s.name[0])}</div>`;
    const media = (s.media || []).map((m, i) => {
      const inner = m.type === "video"
        ? `<video muted loop playsinline preload="none" poster="${esc(m.poster || "")}" data-src="${esc(m.src)}"></video><span class="tag">Video</span>`
        : `<img src="${esc(m.src)}" alt="${esc(m.caption || "")}" loading="lazy" decoding="async">`;
      return `<figure><button type="button" data-section="${esc(s.id)}" data-i="${i}" aria-label="Open ${esc(m.caption || s.name)}"><div class="${m.shape === "wide" ? "wide" : "phone"}"${m.ratio ? ` style="--r:${m.ratio}"` : ""}>${inner}</div></button>${m.caption ? `<figcaption>${esc(m.caption)}</figcaption>` : ""}</figure>`;
    }).join("");
    return `<div class="title">${badge}<div><h2>${esc(s.name)}</h2><div class="kind">${esc(s.kind)}</div></div></div>
      <p class="lede">${esc(s.lede)}</p>${paras(s)}
      <ul class="offers">${(s.offers || []).map(o => `<li>${esc(o)}</li>`).join("")}</ul>
      ${linkButtons(s.links)}
      ${media ? `<div class="strip">${media}</div>` : ""}`;
  },
  soundcloud(s) {
    const url = `https://soundcloud.com/${s.user}`;
    return `<h2>${esc(s.name)}</h2><div style="height:12px"></div>${paras(s)}
      ${linkButtons([{ label: "SoundCloud", href: url, primary: true }])}
      <div class="player" data-sc="${esc(url)}"><div class="load">Tracks from soundcloud.com/${esc(s.user)}<br><br><button class="btn" type="button">${ICONS.play}Load player</button></div></div>`;
  },
  links(s) {
    return `<h2>${esc(s.name)}</h2><ul class="offers">${s.items.map(l => `<li><a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a> ${esc(l.note || "")}</li>`).join("")}</ul>`;
  },
  text(s) {
    return `<h2>${esc(s.name)}</h2><div style="height:14px"></div>${paras(s)}`;
  }
};
const render = s => (RENDER[s.type] || RENDER.text)(s);

/* Header */
// Projects open on the table; Music and GitHub go straight out to SoundCloud and GitHub.
const OUT = '<svg class="out" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 2.5h5.5V8M9.5 2.5L3 9"/></svg>';
const outLink = (href, label) => `<a href="${esc(href)}" target="_blank" rel="noopener" aria-label="${esc(label)} (opens in a new tab)">${esc(label)}${OUT}</a>`;
document.getElementById("nav").innerHTML = SITE.sections.filter(s => !s.footer).map(s => s.type === "soundcloud"
  ? outLink(`https://soundcloud.com/${s.user}`, s.short || s.name)
  : `<a href="#${esc(s.id)}">${esc(s.short || s.name)}</a>`).join("") + outLink(SITE.github, "GitHub");
const navLinks = [...document.querySelectorAll("#nav a[href^='#']")];
const hint = document.getElementById("hint");
const BASE_HINT = phone ? "Swipe for more, tap to look closer" : "Click a model to look closer";
hint.innerHTML = `${BASE_HINT} · <a href="#credits">Credits</a>`;

/* Panel */
const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
let vidObs = null;
function fillPanel(s) {
  panel.dataset.p = s.id;
  pbody.innerHTML = render(s);
  panel.scrollTop = 0;
  vidObs?.disconnect();
  vidObs = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; if (!reduced) v.play().catch(() => {}); } else v.pause();
  }), { root: panel, threshold: 0.35 });
  pbody.querySelectorAll("video[data-src]").forEach(v => vidObs.observe(v));
  pbody.querySelectorAll(".player[data-sc]").forEach(p => p.querySelector("button").addEventListener("click", () => {
    const src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(p.dataset.sc) + "&color=%23111111&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&visual=false";
    p.innerHTML = `<iframe title="SoundCloud: ${esc(p.dataset.sc)}" allow="autoplay" src="${src}"></iframe>`;
  }));
  const dark = ["spirit-aquarium", "op-xy", "music"].includes(s.id);
  document.body.classList.toggle("dark-panel", dark);
}

/* Routing: #<section id> opens it; no hash is the table */
let table = null;
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const s = SITE.sections.find(x => x.id === id);
  navLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + id));
  if (!s) { document.body.classList.remove("open"); table?.close(); hint.innerHTML = `${BASE_HINT} · <a href="#credits">Credits</a>`; return; }
  if (document.body.classList.contains("flat")) { document.getElementById(id)?.scrollIntoView(); return; }
  fillPanel(s);
  document.body.classList.add("open");
  document.body.classList.toggle("proj", s.type === "project");
  if (s.type === "project" && table) table.open(id); else table?.close();
  hint.textContent = phone ? (s.hint || "").replace(/\bClick\b/g, "Tap").replace(/\bclick\b/g, "tap") : (s.hint || "");
}
addEventListener("hashchange", route);
// Step through the projects in table order, wrapping round.
const stepProject = d => {
  const ps = SITE.sections.filter(x => x.type === "project"), i = ps.findIndex(x => x.id === decodeURIComponent(location.hash.slice(1)));
  if (i >= 0) location.hash = ps[(i + d + ps.length) % ps.length].id;
};
document.getElementById("car-prev").onclick = () => stepProject(-1);
document.getElementById("car-next").onclick = () => stepProject(1);
document.getElementById("close").onclick = () => { history.pushState(null, "", location.pathname + location.search); route(); };
document.getElementById("home").onclick = e => { e.preventDefault(); history.pushState(null, "", location.pathname + location.search); route(); };
addEventListener("keydown", e => { if (e.key === "Escape" && !viewer.open && document.body.classList.contains("open")) document.getElementById("close").click(); });
// Left and right arrows step through the projects too, unless the open model plays with them (PLASM's gel).
// The table's own listener runs first and claims the keys it uses.
const arrowsStep = () => addEventListener("keydown", e => {
  if (e.defaultPrevented || viewer.open || e.altKey || e.metaKey || e.ctrlKey || !document.body.classList.contains("proj") || !document.body.classList.contains("open")) return;
  if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); stepProject(-1); } else if (e.key === "ArrowRight") { e.preventDefault(); stepProject(1); }
});
addEventListener("popstate", route);

/* The table, or a plain page where WebGL isn't available */
function webgl() { try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2")); } catch { return false; } }
if (webgl() && !/[?&]flat\b/.test(location.search)) {
  const { mountTable } = await import("./js/table.js");
  table = mountTable({
    canvas: document.getElementById("table"), labels: document.getElementById("labels"), phone, reduced, look: lookParam === "none" ? null : lookParam,
    projects: SITE.sections.filter(s => s.type === "project"),
    onDismiss: () => document.getElementById("close").click()
  });
  window.__table = table;
  arrowsStep();
  if (trying) {
    // While looks are being tried: a switcher that reloads the page in another one, keeping the open section.
    const names = [["none", "", "Current"], ["memory", "lilac", "Lilac"], ["memory", "pink", "Pink"], ["memory", "butter", "Butter"]];
    const bar = document.createElement("nav"); bar.className = "looks"; bar.setAttribute("aria-label", "Looks");
    bar.innerHTML = names.map(([k, r, t]) => {
      const q = new URLSearchParams(location.search); q.set("look", k); q.set("looks", ""); if (r) q.set("room", r); else q.delete("room");
      const on = lookParam === k && (!r || roomParam === r);
      return `<a href="?${q}" class="${on ? "on" : ""}">${t}</a>`;
    }).join("");
    document.body.append(bar);
  }
} else {
  document.body.classList.add("flat");
  document.getElementById("flat").innerHTML = SITE.sections.map(s => `<section id="${esc(s.id)}" data-p="${esc(s.id)}">${render(s)}</section>`).join("");
}
route();

/* Viewer */
const viewer = document.getElementById("viewer"), stage = document.getElementById("viewer-stage"), cap = document.getElementById("viewer-cap");
let showing = null, opener = null;
function show(sectionId, i) {
  const s = SITE.sections.find(x => x.id === sectionId), list = s.media;
  i = (i + list.length) % list.length; showing = { sectionId, i };
  const m = list[i];
  stage.innerHTML = m.type === "video"
    ? `<video src="${esc(m.src)}" poster="${esc(m.poster || "")}" muted loop playsinline autoplay controls></video>`
    : `<img src="${esc(m.src)}" alt="${esc(m.caption || "")}">`;
  cap.textContent = `${s.short || s.name}${m.caption ? " · " + m.caption : ""}  (${i + 1} of ${list.length})`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".strip figure button"); if (!b) return;
  opener = b; show(b.dataset.section, +b.dataset.i); viewer.showModal();
});
const step = d => showing && show(showing.sectionId, showing.i + d);
document.getElementById("viewer-prev").onclick = () => step(-1);
document.getElementById("viewer-next").onclick = () => step(1);
document.getElementById("viewer-close").onclick = () => viewer.close();
viewer.addEventListener("click", e => { if (e.target === viewer || e.target === stage) viewer.close(); });
viewer.addEventListener("keydown", e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
viewer.addEventListener("close", () => { stage.innerHTML = ""; showing = null; opener?.focus({ preventScroll: true }); });
let tx = null;
viewer.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });
</script>
</body>
